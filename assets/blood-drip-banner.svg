<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="340" viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#000000"/>
    <stop offset="60%" stop-color="#0a0000"/>
    <stop offset="100%" stop-color="#1a0000"/>
  </linearGradient>
  <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5a0000"/>
    <stop offset="50%" stop-color="#a30000"/>
    <stop offset="100%" stop-color="#e00000"/>
  </linearGradient>
</defs>

<style>
  .drip { fill: url(#blood); animation-timing-function: ease-in; animation-iteration-count: infinite; }
  @keyframes fall {
    0%   { transform: translateY(-40px); opacity: 0; }
    10%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translateY(300px); opacity: 0; }
  }
  .drip { animation-name: fall; }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    40%      { opacity: 0.55; }
    55%      { opacity: 0.9; }
    72%      { opacity: 0.35; }
  }
  .title { animation-name: flicker; animation-iteration-count: infinite; }
  @keyframes poolgrow {
    0%   { rx: 0;   opacity: 0; }
    12%  { opacity: 1; }
    100% { rx: 430; opacity: 1; }
  }
  .pool { animation-name: poolgrow; animation-fill-mode: forwards; }
</style>

<rect width="1000" height="340" fill="url(#bgGrad)"/>

<g>
  <path class="drip" style="animation-duration:2.1s;animation-delay:0s"   d="M28,-20  c-6,10 -6,22 0,30 c6,-8 6,-20 0,-30 z"/>
