  <path class="drip" style="animation-duration:1.7s;animation-delay:0.6s" d="M825,-10 c-7,11 -7,24 0,33 c7,-9 7,-22 0,-33 z"/>
  <path class="drip" style="animation-duration:2.9s;animation-delay:0.1s" d="M885,-40 c-5,9 -5,19 0,26 c5,-7 5,-17 0,-26 z"/>
