  <path class="drip" style="animation-duration:2.3s;animation-delay:1.6s" d="M270,-25 c-6,10 -6,21 0,29 c6,-8 6,-19 0,-29 z"/>
  <path class="drip" style="animation-duration:2.8s;animation-delay:0.8s" d="M330,-35 c-6,9 -6,20 0,27 c6,-7 6,-18 0,-27 z"/>
  <path class="drip" style="animation-duration:1.9s;animation-delay:2.1s" d="M395,-15 c-7,11 -7,23 0,32 c7,-9 7,-21 0,-32 z"/>
  <path class="drip" style="animation-duration:2.7s;animation-delay:0.3s" d="M640,-45 c-5,8 -5,18 0,25 c5,-7 5,-17 0,-25 z"/>
