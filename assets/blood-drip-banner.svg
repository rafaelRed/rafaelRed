</g>

<text class="title" x="500" y="176" font-family="Courier New, monospace" font-size="80" font-weight="bold" fill="#ff2222" text-anchor="middle" style="animation-duration:2.8s">RAFA DEV</text>

<text x="500" y="216" font-family="Courier New, monospace" font-size="17" fill="#ff5555" text-anchor="middle" letter-spacing="2" class="title" style="animation-duration:1.5s">SYSTEM COMPROMISED - ROOT ACCESS GRANTED</text>

