<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="blood2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5a0000"/>
    <stop offset="100%" stop-color="#ff0000"/>
  </linearGradient>
</defs>

<style>
  @keyframes bgpulse {
    0%, 100% { fill: #000000; }
    8%       { fill: #3a0000; }
    16%      { fill: #000000; }
  }
  .bg { animation-name: bgpulse; animation-duration: 1.2s; animation-iteration-count: 3; animation-fill-mode: forwards; }

  @keyframes flash {
    0%   { opacity: 0; }
    3%   { opacity: 0.85; }
    7%   { opacity: 0; }
    16%  { opacity: 0.55; }
    22%  { opacity: 0; }
    100% { opacity: 0; }
  }
  .flash { opacity: 0; animation-name: flash; animation-duration: 1.2s; animation-iteration-count: 3; animation-fill-mode: forwards; }

  @keyframes textflicker {
    0%   { opacity: 0; }
    4%   { opacity: 1; }
    9%   { opacity: 0.2; }
    14%  { opacity: 1; }
    18%  { opacity: 0.3; }
    24%  { opacity: 1; }
    100% { opacity: 1; }
  }
  .scaretext { opacity: 0; animation-name: textflicker; animation-duration: 1.2s; animation-iteration-count: 3; animation-fill-mode: forwards; }

  @keyframes popscale {
    0%   { transform: scale(1.5); }
    20%  { transform: scale(1); }
    100% { transform: scale(1); }
  }
  .popscale { transform-origin: 500px 175px; animation-name: popscale; animation-duration: 1.2s; animation-iteration-count: 3; animation-fill-mode: forwards; }

  .drip2 { fill: url(#blood2); animation-timing-function: ease-in; animation-iteration-count: infinite; }
  @keyframes fall2 {
    0%   { transform: translateY(-40px); opacity: 0; }
    10%  { opacity: 0.9; }
    80%  { opacity: 0.9; }
    100% { transform: translateY(220px); opacity: 0; }
  }
  .drip2 { animation-name: fall2; }
</style>

<rect class="bg" width="1000" height="220" fill="#000000"/>
<rect class="flash" width="1000" height="220" fill="#ffffff"/>

<text class="scaretext" x="500" y="95" font-family="Courier New, monospace" font-size="30" fill="#ff1a1a" text-anchor="middle" letter-spacing="4">NEXT TARGET ACQUIRED</text>

<text class="scaretext popscale" x="500" y="175" font-family="Courier New, monospace" font-size="90" font-weight="bold" fill="#ffffff" text-anchor="middle">YOU</text>

<g opacity="0.9">
  <path class="drip2" style="animation-duration:1.9s;animation-delay:0.9s" d="M120,-40 c-8,14 -8,30 0,42 c8,-12 8,-28 0,-42 z"/>
  <path class="drip2" style="animation-duration:2.3s;animation-delay:0.4s" d="M340,-30 c-7,12 -7,26 0,36 c7,-10 7,-24 0,-36 z"/>
  <path class="drip2" style="animation-duration:1.7s;animation-delay:1.3s" d="M560,-35 c-8,13 -8,29 0,40 c8,-11 8,-27 0,-40 z"/>
  <path class="drip2" style="animation-duration:2.1s;animation-delay:0.6s" d="M780,-25 c-7,12 -7,25 0,35 c7,-10 7,-23 0,-35 z"/>
  <path class="drip2" style="animation-duration:2.5s;animation-delay:1.1s" d="M900,-30 c-8,13 -8,28 0,39 c8,-11 8,-26 0,-39 z"/>
</g>
</svg>
